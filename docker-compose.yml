services:
  game:
    image: ${GAME_IMAGE:-zhajinhua:latest-amd64}
    platform: linux/${GAME_ARCH:-amd64}
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_IP:-0.0.0.0}:${GAME_PORT:-3001}:3000"
    volumes:
      - game-data:/app/data
    environment:
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      DATABASE_URL: "${DATABASE_URL:-}"
    stop_grace_period: 10s
volumes:
  game-data:
